<style>
/* =====================================================================
   STARTUP · LIQUID GLASS DESIGN SYSTEM  (v3)
   Black & white, yellow accent (#FFD400, from the logo), layered translucent surfaces.
   --y is kept as the accent token name (yellow) so all logic keeps working.
   ===================================================================== */
:root{
  /* accent: polished silver */
  --y:#FFD400; --y-ink:#0A0B0D; --y-soft:rgba(255,212,0,.18);
  --chrome:linear-gradient(135deg,#FFE766 0%,#FFD400 30%,#F2B800 55%,#FFDF33 78%,#FFD400 100%);
  --chrome-v:linear-gradient(180deg,#FFE766 0%,#FFD400 50%,#E6B000 100%);
  --chrome-text:linear-gradient(100deg,#0A0B0D 0%,#5C616A 38%,#0A0B0D 55%,#3E4249 80%,#0A0B0D 100%);
  --obsidian:linear-gradient(160deg,#25272B 0%,#0E0F11 46%,#060607 72%,#17181B 100%);

  /* surfaces */
  --bg:#FFFFFF; --surface:rgba(255,255,255,.62); --soft:rgba(255,255,255,.58); --field:rgba(118,124,134,.10);
  --ink:#0A0B0D; --ink-2:#26282C; --muted:#5D626B; --line:rgba(12,14,18,.09);
  --glass:rgba(255,255,255,.56); --glass-2:rgba(255,255,255,.78); --edge:rgba(255,255,255,.9); --edge-lo:rgba(12,14,18,.06);
  --hi:inset 0 1px 0 rgba(255,255,255,.95),inset 0 -1px 0 rgba(12,14,18,.04);
  --inv:var(--obsidian); --inv-ink:#F5F6F8; --inv-muted:#9A9FA8; --inv-line:rgba(255,255,255,.10); --inv-soft:rgba(255,255,255,.06);
  --ok:#1E7F49; --ok-soft:rgba(30,127,73,.10); --err:#C2281E; --err-soft:rgba(194,40,30,.08);

  --ambient:
    radial-gradient(900px 520px at 88% -8%,rgba(255,255,255,.95),transparent 62%),
    radial-gradient(760px 520px at -12% 22%,rgba(255,212,0,.10),transparent 64%),
    radial-gradient(820px 640px at 108% 96%,rgba(235,236,238,.6),transparent 62%),
    linear-gradient(180deg,#FFFFFF 0%,#FAFAFA 100%);
  --grid:rgba(12,14,18,.035);

  --display:"Geist","IBM Plex Sans Arabic",system-ui,sans-serif;
  --body:"Geist","IBM Plex Sans Arabic",system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"Geist Mono",ui-monospace,"SF Mono",monospace;
  --r-xl:30px; --r-lg:24px; --r-md:18px; --r-sm:14px; --r-pill:999px;
  --s1:4px; --s2:8px; --s3:12px; --s4:16px; --s5:20px; --s6:24px; --s8:32px;
  --tab-h:66px;
  --sh-1:0 1px 2px rgba(10,12,16,.05),0 8px 24px -14px rgba(10,12,16,.22);
  --sh-2:0 2px 6px rgba(10,12,16,.06),0 24px 56px -22px rgba(10,12,16,.42);
  --sh-3:0 30px 80px -30px rgba(10,12,16,.55);
  --blur:blur(22px) saturate(170%);
  --ease:cubic-bezier(.2,.8,.2,1); --spring:cubic-bezier(.34,1.56,.64,1);
  --t-fast:.18s; --t-base:.3s; --t-slow:.55s;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --y:#FFD400; --y-soft:rgba(255,212,0,.12);
  --chrome-text:linear-gradient(100deg,#FFFFFF 0%,#9EA3AC 35%,#FFFFFF 55%,#C3C7CE 78%,#FFFFFF 100%);
  --obsidian:linear-gradient(160deg,rgba(46,48,53,.72) 0%,rgba(18,19,22,.78) 50%,rgba(10,10,12,.82) 100%);
  --bg:#060607; --surface:rgba(26,27,31,.55); --soft:rgba(255,255,255,.045); --field:rgba(255,255,255,.055);
  --ink:#F4F5F7; --ink-2:#D5D7DB; --muted:#8D929B; --line:rgba(255,255,255,.085);
  --glass:rgba(24,25,29,.52); --glass-2:rgba(30,31,36,.82); --edge:rgba(255,255,255,.10); --edge-lo:rgba(0,0,0,.4);
  --hi:inset 0 1px 0 rgba(255,255,255,.12),inset 0 -1px 0 rgba(0,0,0,.35);
  --inv-line:rgba(255,255,255,.10); --inv-soft:rgba(255,255,255,.05);
  --ok:#5CCB8A; --ok-soft:rgba(92,203,138,.10); --err:#FF6B61; --err-soft:rgba(255,107,97,.10);
  --ambient:
    radial-gradient(900px 540px at 82% -12%,rgba(255,255,255,.085),transparent 62%),
    radial-gradient(700px 520px at -10% 28%,rgba(150,156,166,.09),transparent 64%),
    radial-gradient(900px 640px at 110% 100%,rgba(190,196,206,.06),transparent 62%),
    linear-gradient(180deg,#09090B 0%,#040405 100%);
  --grid:rgba(255,255,255,.028);
  --sh-1:0 1px 2px rgba(0,0,0,.4),0 10px 28px -14px rgba(0,0,0,.7);
  --sh-2:0 2px 6px rgba(0,0,0,.4),0 28px 60px -22px rgba(0,0,0,.85);
  color-scheme:dark}}
:root[data-theme="dark"]{
  --y:#FFD400; --y-soft:rgba(255,212,0,.12);
  --chrome-text:linear-gradient(100deg,#FFFFFF 0%,#9EA3AC 35%,#FFFFFF 55%,#C3C7CE 78%,#FFFFFF 100%);
  --obsidian:linear-gradient(160deg,rgba(46,48,53,.72) 0%,rgba(18,19,22,.78) 50%,rgba(10,10,12,.82) 100%);
  --bg:#060607; --surface:rgba(26,27,31,.55); --soft:rgba(255,255,255,.045); --field:rgba(255,255,255,.055);
  --ink:#F4F5F7; --ink-2:#D5D7DB; --muted:#8D929B; --line:rgba(255,255,255,.085);
  --glass:rgba(24,25,29,.52); --glass-2:rgba(30,31,36,.82); --edge:rgba(255,255,255,.10); --edge-lo:rgba(0,0,0,.4);
  --hi:inset 0 1px 0 rgba(255,255,255,.12),inset 0 -1px 0 rgba(0,0,0,.35);
  --inv-line:rgba(255,255,255,.10); --inv-soft:rgba(255,255,255,.05);
  --ok:#5CCB8A; --ok-soft:rgba(92,203,138,.10); --err:#FF6B61; --err-soft:rgba(255,107,97,.10);
  --ambient:
    radial-gradient(900px 540px at 82% -12%,rgba(255,255,255,.085),transparent 62%),
    radial-gradient(700px 520px at -10% 28%,rgba(150,156,166,.09),transparent 64%),
    radial-gradient(900px 640px at 110% 100%,rgba(190,196,206,.06),transparent 62%),
    linear-gradient(180deg,#09090B 0%,#040405 100%);
  --grid:rgba(255,255,255,.028);
  --sh-1:0 1px 2px rgba(0,0,0,.4),0 10px 28px -14px rgba(0,0,0,.7);
  --sh-2:0 2px 6px rgba(0,0,0,.4),0 28px 60px -22px rgba(0,0,0,.85);
  color-scheme:dark}

/* ===== Base ===== */
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0}
html{background:var(--ambient);background-color:var(--bg);background-attachment:fixed;min-height:100%}
body{background:transparent;color:var(--ink);font:400 16px/1.55 var(--body);-webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale;overflow-x:hidden;min-height:100vh;font-feature-settings:"ss01","cv11";
  padding-bottom:calc(var(--tab-h) + 36px + env(safe-area-inset-bottom,0px))}
body.no-tabs{padding-bottom:calc(28px + env(safe-area-inset-bottom,0px))}
body.locked{overflow:hidden}
[hidden]{display:none!important}
::selection{background:var(--ink);color:var(--bg)}

/* ambient layer: precision grid + slow chrome light */
.ambient{position:fixed;inset:0;z-index:-1;pointer-events:none;overflow:hidden}
.ambient::before{content:"";position:absolute;inset:0;background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);background-size:44px 44px;
  -webkit-mask-image:radial-gradient(120% 70% at 50% 0%,#000 30%,transparent 75%);mask-image:radial-gradient(120% 70% at 50% 0%,#000 30%,transparent 75%)}
.ambient i{position:absolute;border-radius:50%;filter:blur(60px);opacity:.55;will-change:transform}
.ambient i:nth-child(1){width:60vmax;height:60vmax;top:-30vmax;inset-inline-end:-20vmax;background:conic-gradient(from 120deg,rgba(255,255,255,.9),rgba(255,212,0,.22),rgba(255,255,255,.7),rgba(255,255,255,.6),rgba(255,255,255,.9));animation:drift 28s ease-in-out infinite alternate}
.ambient i:nth-child(2){width:46vmax;height:46vmax;bottom:-24vmax;inset-inline-start:-18vmax;background:radial-gradient(circle,rgba(255,212,0,.18),transparent 70%);animation:drift 34s ease-in-out infinite alternate-reverse}
:root[data-theme="dark"] .ambient i{opacity:.10}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .ambient i{opacity:.10}}
@keyframes drift{from{transform:translate3d(0,0,0) rotate(0)}to{transform:translate3d(-6vmax,5vmax,0) rotate(40deg)}}

h1,h2,h3{font-family:var(--display);margin:0;letter-spacing:-.035em;text-wrap:balance}
[dir="rtl"] h1,[dir="rtl"] h2,[dir="rtl"] h3{letter-spacing:0}
h1{font-size:clamp(2.2rem,9vw,3.7rem);line-height:1.02;font-weight:600}
h2{font-size:clamp(1.6rem,6.4vw,2.35rem);line-height:1.08;font-weight:600}
h3{font-size:1rem;font-weight:600;line-height:1.3;letter-spacing:-.015em}
p{margin:0}
a{color:inherit}
.num{font-variant-numeric:tabular-nums;font-feature-settings:"tnum"}
.muted{color:var(--muted)}
.wrap{max-width:720px;margin:0 auto;padding-inline:max(18px,env(safe-area-inset-left,0px)) max(18px,env(safe-area-inset-right,0px))}
:focus-visible{outline:2px solid var(--ink);outline-offset:3px;border-radius:10px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
svg.i{width:20px;height:20px;flex:none}
[dir="rtl"] svg.flip{transform:scaleX(-1)}

/* ===== Glass primitives (applied to existing components) ===== */
.card,.path a,.qa,.kpi,.kv div,.canvas div,.saved li,.list,.who,.ms>li,.empty,.sum,.mock figure,.season,.vs .a,.faq,.trust{
  background:var(--glass);-webkit-backdrop-filter:var(--blur);backdrop-filter:var(--blur);
  border:1px solid var(--edge);box-shadow:var(--hi),var(--sh-1)}
.card,.inv,.path a,.qa,.who,.dash,.plan{position:relative;isolation:isolate}
/* specular highlight + pointer-reactive sheen */
.card::before,.inv::before,.path a::before,.qa::before,.who::before{content:"";position:absolute;inset:0;border-radius:inherit;z-index:-1;pointer-events:none;
  background:radial-gradient(420px circle at var(--mx,20%) var(--my,-20%),rgba(255,255,255,.55),transparent 42%),linear-gradient(180deg,rgba(255,255,255,.35),transparent 38%);opacity:.75;transition:opacity var(--t-base)}
:root[data-theme="dark"] :is(.card,.path a,.qa,.who)::before{background:radial-gradient(420px circle at var(--mx,20%) var(--my,-20%),rgba(255,255,255,.09),transparent 45%),linear-gradient(180deg,rgba(255,255,255,.05),transparent 40%)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) :is(.card,.path a,.qa,.who)::before{background:radial-gradient(420px circle at var(--mx,20%) var(--my,-20%),rgba(255,255,255,.09),transparent 45%),linear-gradient(180deg,rgba(255,255,255,.05),transparent 40%)}}
.inv::before{background:radial-gradient(520px circle at var(--mx,85%) var(--my,-10%),rgba(255,255,255,.16),transparent 45%),linear-gradient(180deg,rgba(255,255,255,.07),transparent 30%)}
@supports not ((backdrop-filter:blur(1px)) or (-webkit-backdrop-filter:blur(1px))){
  :root{--glass:rgba(255,255,255,.9);--surface:#fff}
  :root[data-theme="dark"]{--glass:rgba(24,25,29,.95);--surface:#17181B}}

/* ===== Splash ===== */
.splash{position:fixed;inset:0;z-index:100;background:#FFFFFF;display:grid;place-items:center;transition:opacity .6s var(--ease),visibility .6s,filter .6s var(--ease)}
.splash video{position:relative;width:min(100vw,80vh);aspect-ratio:4/5;height:auto;object-fit:cover;display:block;-webkit-mask-image:linear-gradient(transparent,#000 8%,#000 92%,transparent);mask-image:linear-gradient(transparent,#000 8%,#000 92%,transparent)}
.splash.out{opacity:0;visibility:hidden;filter:blur(12px)}
.sbar{position:absolute;left:50%;transform:translateX(-50%);bottom:calc(40px + env(safe-area-inset-bottom,0px));display:flex;align-items:center;gap:10px}
.sbar .skip{position:static;transform:none}
.snd{flex:none;width:44px;height:44px;border-radius:50%;border:1px solid rgba(255,255,255,.14);background:linear-gradient(160deg,#25272B,#060607);color:#E4E7EB;display:grid;place-items:center;cursor:pointer;box-shadow:inset 1.5px 1.5px 0 rgba(255,255,255,.25),0 10px 24px -10px rgba(0,0,0,.55);animation:sndPulse 1.6s ease-in-out infinite}
.snd[hidden]{display:none}
@keyframes sndPulse{50%{transform:scale(1.08)}}
.skip{position:absolute;left:50%;transform:translateX(-50%);bottom:calc(40px + env(safe-area-inset-bottom,0px));
  font:600 1.02rem var(--body);letter-spacing:-.01em;color:#fff;background:var(--obsidian);border:1px solid rgba(255,255,255,.14);border-radius:var(--r-pill);padding:0 32px;min-height:56px;min-width:210px;cursor:pointer;
  box-shadow:inset 0 1px 0 rgba(255,255,255,.22),0 18px 40px -14px rgba(0,0,0,.55);display:inline-flex;align-items:center;justify-content:center;gap:10px}
[dir="rtl"] .skip svg{transform:scaleX(-1)}

/* ===== Onboarding ===== */
.onb{position:fixed;inset:0;z-index:80;background:var(--ambient);background-color:var(--bg);display:flex;flex-direction:column;
  padding:calc(env(safe-area-inset-top,0px) + 12px) max(20px,env(safe-area-inset-right,0px)) calc(env(safe-area-inset-bottom,0px) + 20px) max(20px,env(safe-area-inset-left,0px));overflow-y:auto}
.onb-in{max-width:480px;width:100%;margin:0 auto;flex:1;display:flex;flex-direction:column;gap:24px}
.onb-top{display:flex;justify-content:space-between;align-items:center;min-height:44px}
.onb-skip{background:var(--glass);-webkit-backdrop-filter:var(--blur);backdrop-filter:var(--blur);border:1px solid var(--edge);border-radius:var(--r-pill);font:500 .86rem var(--body);color:var(--muted);cursor:pointer;padding:0 16px;min-height:38px}
.onb-art{flex:1;min-height:220px;display:grid;place-items:center;position:relative;perspective:900px}
.onb-art::before{content:"";position:absolute;width:min(78%,300px);aspect-ratio:1;border-radius:50%;background:var(--chrome);opacity:.35;filter:blur(40px);z-index:-1}
.onb-copy{display:flex;flex-direction:column;gap:12px}
.onb-copy p{color:var(--muted);font-size:1.04rem}
.dots{display:flex;gap:6px}
.dots i{width:8px;height:8px;border-radius:4px;background:var(--line);transition:width var(--t-base) var(--spring),background var(--t-base)}
.dots i.on{width:26px;background:var(--ink)}
.onb-foot{display:flex;flex-direction:column;gap:12px}
.slide{display:flex;flex-direction:column;gap:24px;flex:1;animation:slide var(--t-slow) var(--ease)}
@keyframes slide{from{opacity:0;transform:translateX(22px);filter:blur(6px)}to{opacity:1;transform:none;filter:none}}
[dir="rtl"] .slide{animation-name:slide-r}
@keyframes slide-r{from{opacity:0;transform:translateX(-22px);filter:blur(6px)}to{opacity:1;transform:none;filter:none}}
.art-mark{font:600 clamp(3.6rem,19vw,5.4rem)/1 var(--display);letter-spacing:-.06em;display:flex;align-items:baseline;background:var(--chrome-text);-webkit-background-clip:text;background-clip:text;color:transparent;background-size:220% 100%;animation:shine 6s var(--ease) infinite}
.art-mark i{width:.2em;height:.2em;border-radius:50%;background:var(--chrome);margin-inline-start:.05em;display:inline-block;box-shadow:inset 0 -2px 3px rgba(0,0,0,.25),0 4px 10px rgba(0,0,0,.2)}
@keyframes shine{0%,100%{background-position:0% 0}50%{background-position:100% 0}}
.art-card{width:min(100%,320px);transform:rotateX(14deg) rotateZ(-3deg);box-shadow:var(--sh-3);animation:float 7s ease-in-out infinite}
@keyframes float{0%,100%{transform:rotateX(14deg) rotateZ(-3deg) translateY(0)}50%{transform:rotateX(10deg) rotateZ(-2deg) translateY(-8px)}}
.art-stack{width:min(100%,320px);display:flex;flex-direction:column;gap:10px}
.art-stack>div{transform-origin:center}
.lang-pick{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.lang-pick button{min-height:58px;border-radius:var(--r-md);border:1px solid var(--edge);background:var(--glass);-webkit-backdrop-filter:var(--blur);backdrop-filter:var(--blur);box-shadow:var(--hi),var(--sh-1);color:var(--ink);font:600 1rem var(--body);cursor:pointer;transition:all var(--t-base) var(--ease)}
.lang-pick button[aria-pressed="true"]{background:var(--obsidian);color:#fff;border-color:rgba(255,255,255,.14);box-shadow:inset 0 1px 0 rgba(255,255,255,.2),var(--sh-2)}

/* ===== Header ===== */
.top{position:sticky;top:0;z-index:20;padding-top:env(safe-area-inset-top,0px);border-bottom:1px solid transparent;transition:background var(--t-base),border-color var(--t-base),box-shadow var(--t-base)}
.top.scrolled{background:var(--glass);-webkit-backdrop-filter:var(--blur);backdrop-filter:var(--blur);border-bottom-color:var(--line);box-shadow:0 10px 30px -24px rgba(0,0,0,.5)}
.top .wrap{display:flex;align-items:center;justify-content:space-between;gap:12px;height:64px}
.wordmark{font:600 1.5rem/1 var(--display);letter-spacing:-.055em;color:var(--ink);text-decoration:none;display:inline-flex;align-items:baseline}
.wordmark i{width:.24em;height:.24em;border-radius:50%;background:var(--chrome);display:inline-block;margin-inline-start:.06em;box-shadow:inset 0 -1px 2px rgba(0,0,0,.3),0 1px 3px rgba(0,0,0,.18)}
.back{display:inline-flex;align-items:center;gap:6px;background:var(--glass);-webkit-backdrop-filter:var(--blur);backdrop-filter:var(--blur);border:1px solid var(--edge);box-shadow:var(--hi);border-radius:var(--r-pill);color:var(--ink);font:500 .92rem var(--body);cursor:pointer;min-height:42px;padding:0 16px 0 10px;text-decoration:none;transition:transform var(--t-fast) var(--ease)}
[dir="rtl"] .back{padding:0 10px 0 16px}
.back:active{transform:scale(.96)}
.top-actions{display:flex;align-items:center;gap:8px}
.icon-btn{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;background:var(--glass);border:1px solid var(--edge);box-shadow:var(--hi);color:var(--ink);cursor:pointer;text-decoration:none;position:relative;transition:transform var(--t-fast) var(--ease),background var(--t-fast)}
.icon-btn:active{transform:scale(.92)}
.avatar{width:42px;height:42px;border-radius:50%;background:var(--obsidian);border:1px solid rgba(255,255,255,.16);color:#fff;display:grid;place-items:center;font:600 1rem var(--display);text-decoration:none;flex:none;
  box-shadow:inset 0 1px 0 rgba(255,255,255,.25),0 0 0 3px var(--glass),0 8px 20px -8px rgba(0,0,0,.5);position:relative;transition:transform var(--t-base) var(--spring)}
.avatar::after{content:"";position:absolute;inset:-4px;border-radius:50%;padding:1px;background:var(--chrome);-webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask-composite:exclude;opacity:.8}
a.avatar:hover{transform:scale(1.06)}
.avatar.lg{width:68px;height:68px;font-size:1.6rem}
.install{font:600 .8rem var(--body);background:var(--chrome);color:var(--y-ink);border:1px solid rgba(255,255,255,.8);border-radius:var(--r-pill);padding:0 16px;min-height:36px;cursor:pointer;box-shadow:inset 0 1px 0 #fff,0 6px 16px -8px rgba(0,0,0,.4)}

/* offline banner */
.offline{background:var(--obsidian);color:#fff;font-size:.82rem;text-align:center;padding:8px 16px;letter-spacing:.01em}

/* ===== Views ===== */
.view{display:flex;flex-direction:column;gap:22px;padding-block:18px 8px;animation:in var(--t-slow) var(--ease)}
@keyframes in{from{opacity:0;transform:translateY(14px) scale(.99);filter:blur(8px)}to{opacity:1;transform:none;filter:none}}
.view>*{animation:rise var(--t-slow) var(--ease) both}
.view>*:nth-child(2){animation-delay:.04s}.view>*:nth-child(3){animation-delay:.08s}.view>*:nth-child(4){animation-delay:.12s}.view>*:nth-child(5){animation-delay:.16s}.view>*:nth-child(6){animation-delay:.2s}.view>*:nth-child(n+7){animation-delay:.24s}
@keyframes rise{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}

.tg:has(input:focus-visible){outline:2px solid var(--ink);outline-offset:2px}
.stepper{display:grid;grid-template-columns:52px 1fr 52px;gap:6px}
.stepper button{min-height:52px;border-radius:var(--r-sm);border:1px solid var(--edge);background:var(--glass-2);box-shadow:var(--hi),var(--sh-1);color:var(--ink);font:500 1.3rem var(--body);cursor:pointer;transition:transform var(--t-fast) var(--spring)}
.stepper button:active{transform:scale(.9)}
.stepper input{text-align:center;font:600 1.1rem var(--display);letter-spacing:-.02em}

/* budget result */
.total{display:flex;flex-direction:column;gap:6px}
.total span{font:500 .72rem var(--mono);letter-spacing:.08em;text-transform:uppercase;color:var(--inv-muted)}
[dir="rtl"] .total span{font:500 .82rem var(--body);letter-spacing:0}
.total b{font:600 clamp(1.6rem,7.4vw,2.4rem)/1.08 var(--display);letter-spacing:-.045em;background:linear-gradient(100deg,#FFFFFF 0%,#A9AEB6 40%,#FFFFFF 62%,#C9CDD3 100%);background-size:200% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;animation:shine 8s var(--ease) infinite}
.stack{display:flex;height:10px;border-radius:5px;overflow:hidden;background:rgba(255,255,255,.08);gap:2px;margin-top:10px}
.stack i{display:block;height:100%;transition:width var(--t-slow) var(--ease)}
.stack i:first-child{background:var(--chrome)!important}
.legend{display:flex;flex-direction:column;gap:10px;margin-top:8px}
.lr{display:grid;grid-template-columns:10px 1fr auto;gap:10px;align-items:center;font-size:.86rem}
.lr i{width:10px;height:10px;border-radius:50%;box-shadow:inset 0 0 0 1px rgba(255,255,255,.2)}
.lr .num{color:var(--inv-muted);font:500 .78rem var(--mono)}
.kv{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.kv div{border-radius:var(--r-md);padding:15px;min-width:0}
.kv span{display:block;font-size:.74rem;color:var(--muted)}
.kv b{font:600 1rem var(--display);letter-spacing:-.02em}
.note{font-size:.8rem;color:var(--muted)}
.warn{font-size:.86rem;background:var(--glass);-webkit-backdrop-filter:var(--blur);backdrop-filter:var(--blur);border:1px solid var(--edge);border-inline-start:3px solid var(--ink);color:var(--ink);padding:13px 15px;border-radius:var(--r-sm);box-shadow:var(--hi)}
.saved{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
.saved li{display:flex;align-items:center;gap:12px;padding:12px 12px 12px 16px;border-radius:var(--r-md);transition:transform var(--t-base) var(--ease)}
.saved li:hover{transform:translateY(-1px)}
[dir="rtl"] .saved li{padding:12px 16px 12px 12px}
.saved .sv-main{flex:1;min-width:0;background:none;border:0;padding:0;text-align:start;color:inherit;font:inherit;cursor:pointer}
.saved b{display:block;font:600 .95rem var(--display);letter-spacing:-.015em}
.saved small{color:var(--muted);font:500 .74rem var(--mono)}

/* sticky total (mobile budget) */
.peek{position:fixed;z-index:25;left:50%;transform:translateX(-50%);bottom:calc(var(--tab-h) + 22px + env(safe-area-inset-bottom,0px));width:min(480px,calc(100% - 24px));
  background:var(--obsidian);-webkit-backdrop-filter:var(--blur);backdrop-filter:var(--blur);color:#fff;border:1px solid rgba(255,255,255,.12);border-radius:var(--r-md);padding:10px 10px 10px 16px;display:flex;align-items:center;gap:12px;box-shadow:inset 0 1px 0 rgba(255,255,255,.16),var(--sh-2);animation:toast var(--t-base) var(--ease);cursor:pointer;font:inherit;text-align:start}
[dir="rtl"] .peek{padding:10px 16px 10px 10px}
.peek span{flex:1;min-width:0;display:flex;flex-direction:column;font-size:.72rem;color:var(--inv-muted)}
.peek b{font:600 1rem var(--display);letter-spacing:-.02em;color:#fff;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.peek i{font-style:normal;background:var(--chrome);color:var(--y-ink);border-radius:var(--r-pill);font:600 .8rem var(--body);padding:9px 14px;white-space:nowrap;box-shadow:inset 0 1px 0 #fff}
@media (min-width:760px){.peek{display:none!important}}
body:has(#toastHost .toast) .peek{visibility:hidden}

/* plans */
.plans{display:flex;flex-direction:column;gap:12px}
.plan{display:flex;flex-direction:column;gap:16px}
.plan-top{display:flex;justify-content:space-between;align-items:center;gap:10px}
.price{font:600 2.5rem/1 var(--display);letter-spacing:-.05em}
.price small{font:500 .78rem var(--mono);color:var(--muted);letter-spacing:.04em}
.inv .price{color:transparent!important;background:linear-gradient(100deg,#FFFFFF 0%,#A9AEB6 40%,#FFFFFF 62%,#C9CDD3 100%);background-size:200% 100%;-webkit-background-clip:text;background-clip:text;animation:shine 8s var(--ease) infinite}
.inv .price small{color:var(--inv-muted);-webkit-text-fill-color:var(--inv-muted)}
.inv.plan{transform:translateZ(0)}
.plan ul{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:9px;font-size:.92rem}
.plan li{display:flex;gap:10px;align-items:flex-start}
.plan li svg{width:18px;height:18px;flex:none;margin-top:2px}
.plan li svg circle{fill:var(--field)} .plan li svg path{stroke:var(--ink)}
.inv.plan li svg circle{fill:#E4E7EB} .inv.plan li svg path{stroke:#0A0B0D}
.trust{display:flex;flex-direction:column;gap:12px}
.trust li{display:flex;gap:12px;align-items:flex-start}
.trust ul{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:16px}
.trust .ic,.row .ic,.incl .ic{width:38px;height:38px;border-radius:12px;background:var(--glass-2);border:1px solid var(--edge);box-shadow:var(--hi),0 4px 10px -6px rgba(0,0,0,.3);display:grid;place-items:center;flex:none}
.trust p{font-size:.88rem;color:var(--muted)}
.faq details{border-bottom:1px solid var(--line);padding:15px 0}
.faq details:last-child{border-bottom:0}
.faq summary{font-weight:600;cursor:pointer;list-style:none;display:flex;justify-content:space-between;gap:12px;align-items:center;min-height:32px;letter-spacing:-.01em}
.faq summary::-webkit-details-marker{display:none}
.faq summary::after{content:"+";flex:none;width:28px;height:28px;border-radius:50%;display:grid;place-items:center;font:400 1.15rem var(--body);color:var(--ink);background:var(--field);border:1px solid var(--line);transition:transform var(--t-base) var(--spring)}
.faq details[open] summary::after{transform:rotate(45deg)}
.faq details[open] p{animation:rise var(--t-base) var(--ease)}
.faq p{color:var(--muted);font-size:.9rem;padding-top:8px}

/* request success */
.success{display:flex;flex-direction:column;align-items:center;text-align:center;gap:16px;padding-top:20px}
.tick{width:92px;height:92px;border-radius:50%;background:var(--chrome);display:grid;place-items:center;animation:pop .6s var(--spring);border:1px solid #fff;
  box-shadow:inset 0 1px 0 #fff,inset 0 -6px 12px rgba(0,0,0,.12),0 0 0 10px var(--y-soft),0 24px 50px -18px rgba(0,0,0,.55)}
.tick svg{width:40px;height:40px}
.tick path{stroke-dasharray:40;stroke-dashoffset:40;animation:draw .5s .25s var(--ease) forwards}
@keyframes draw{to{stroke-dashoffset:0}}
.out{white-space:pre-wrap;font:400 .8rem/1.65 var(--mono);background:var(--field);border:1px solid var(--line);border-radius:var(--r-md);padding:16px;overflow-x:auto;text-align:start;width:100%}
.steps-next{width:100%;text-align:start}

/* profile */
.pf-head{display:flex;align-items:center;gap:18px}
.pf-head h2{font-size:1.5rem}
.list{list-style:none;margin:0;padding:0;border-radius:var(--r-lg);overflow:hidden}
.list>li+li{border-top:1px solid var(--line)}
.row{display:flex;align-items:center;gap:14px;padding:14px 16px;min-height:62px;width:100%;background:none;border:0;color:var(--ink);font:inherit;text-align:start;cursor:pointer;text-decoration:none;transition:background var(--t-fast)}
a.row:hover,button.row:hover{background:var(--soft)}
.row .rt{flex:1;min-width:0;display:flex;flex-direction:column}
.row .rt small{color:var(--muted);font-size:.8rem}
.row .rv{color:var(--muted);font-size:.88rem}
.row.danger,.row.danger .ic{color:var(--err)}
.row.pref{flex-direction:column;align-items:stretch;gap:10px;cursor:default}
.row.pref:hover{background:none}
.row.pref .lab{display:flex;align-items:center;gap:14px;font-weight:500}
.row.pref .seg{width:100%}
.list-label{font:500 .7rem var(--mono);letter-spacing:.14em;text-transform:uppercase;color:var(--muted);padding-inline:4px}
[dir="rtl"] .list-label{letter-spacing:0;font:600 .82rem var(--body)}
.chips{display:flex;flex-wrap:wrap;gap:8px}

/* ===== Overlays: sheet, dialog, toast ===== */
.scrim{position:fixed;inset:0;background:rgba(6,7,9,.45);-webkit-backdrop-filter:blur(8px) saturate(120%);backdrop-filter:blur(8px) saturate(120%);z-index:60;animation:fade var(--t-base) var(--ease)}
@keyframes fade{from{opacity:0}}
.sheet{position:fixed;z-index:61;left:0;right:0;bottom:0;margin:0 auto;max-width:560px;max-height:92vh;overflow-y:auto;background:var(--glass-2);-webkit-backdrop-filter:blur(40px) saturate(180%);backdrop-filter:blur(40px) saturate(180%);
  border:1px solid var(--edge);border-bottom:0;border-radius:var(--r-xl) var(--r-xl) 0 0;box-shadow:var(--hi),var(--sh-3);
  padding:10px 22px calc(22px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:16px;animation:up var(--t-slow) var(--ease)}
@keyframes up{from{transform:translateY(100%)}}
.grab{width:40px;height:5px;border-radius:3px;background:var(--line);margin:0 auto 4px}
.sheet-head{display:flex;justify-content:space-between;align-items:center;gap:12px}
.sum{display:flex;flex-direction:column;gap:11px;border-radius:var(--r-md);padding:16px;box-shadow:var(--hi)}
.sum div{display:flex;justify-content:space-between;gap:12px;font-size:.9rem}
.sum div span{color:var(--muted)}
.sum .tt{border-top:1px solid var(--line);padding-top:11px;font-weight:700;font-size:1.02rem}
.sum .tt span{color:var(--ink)}
.pay{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.pay div{border:1px dashed var(--line);border-radius:var(--r-md);padding:12px;font-size:.84rem;color:var(--muted);display:flex;align-items:center;gap:8px;opacity:.7}
.dlg{position:fixed;z-index:71;inset:0;margin:auto;width:min(calc(100% - 32px),400px);height:max-content;background:var(--glass-2);-webkit-backdrop-filter:blur(40px) saturate(180%);backdrop-filter:blur(40px) saturate(180%);border:1px solid var(--edge);border-radius:var(--r-lg);padding:26px;display:flex;flex-direction:column;gap:12px;box-shadow:var(--hi),var(--sh-3);animation:zoom var(--t-base) var(--spring)}
@keyframes zoom{from{opacity:0;transform:scale(.92)}}
.dlg p{color:var(--muted)}
.dlg .btns{flex-direction:column}
.dlg-scrim{z-index:70}
.toast{width:max-content;position:fixed;z-index:90;left:50%;bottom:calc(var(--tab-h) + 26px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);max-width:calc(100% - 32px);
  background:var(--obsidian);-webkit-backdrop-filter:var(--blur);backdrop-filter:var(--blur);color:#fff;border:1px solid rgba(255,255,255,.12);border-radius:var(--r-pill);padding:10px 10px 10px 18px;display:flex;align-items:center;gap:12px;font-size:.9rem;font-weight:500;box-shadow:inset 0 1px 0 rgba(255,255,255,.16),var(--sh-2);animation:toast var(--t-base) var(--spring)}
[dir="rtl"] .toast{padding:10px 18px 10px 10px}
.toast .dot{width:8px;height:8px;border-radius:50%;background:var(--chrome);flex:none;box-shadow:0 0 10px rgba(220,224,230,.8)}
.toast button{background:var(--chrome);color:var(--y-ink);border:0;border-radius:var(--r-pill);font:600 .82rem var(--body);padding:0 14px;min-height:34px;cursor:pointer;box-shadow:inset 0 1px 0 #fff}
.toast:not(:has(button)){padding:12px 18px}
@keyframes toast{from{opacity:0;transform:translate(-50%,14px) scale(.96)}}
body.no-tabs .toast{bottom:calc(24px + env(safe-area-inset-bottom,0px))}

/* ===== Tab bar: floating obsidian glass ===== */
.tabs{position:fixed;z-index:30;left:50%;transform:translateX(-50%);bottom:calc(12px + env(safe-area-inset-bottom,0px));
  width:min(480px,calc(100% - 24px));height:var(--tab-h);background:rgba(12,13,15,.72);-webkit-backdrop-filter:blur(28px) saturate(180%);backdrop-filter:blur(28px) saturate(180%);
  border:1px solid rgba(255,255,255,.1);border-radius:var(--r-pill);display:grid;grid-template-columns:repeat(5,1fr);padding:6px;
  box-shadow:inset 0 1px 0 rgba(255,255,255,.14),inset 0 -1px 0 rgba(0,0,0,.4),0 24px 50px -16px rgba(0,0,0,.6)}
.tab{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;color:#8E929A;text-decoration:none;border-radius:var(--r-pill);font:500 .62rem var(--body);letter-spacing:.01em;min-width:0;position:relative;
  transition:color var(--t-base),background var(--t-base) var(--ease),box-shadow var(--t-base),transform var(--t-fast) var(--spring)}
.tab:hover{color:#fff}
.tab:active{transform:scale(.92)}
.tab svg{width:21px;height:21px;transition:transform var(--t-base) var(--spring)}
.tab span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%;padding-inline:2px}
.tab[aria-current="page"]{background:var(--chrome);color:#0A0B0D;font-weight:600;box-shadow:inset 0 1px 0 #fff,inset 0 -2px 4px rgba(0,0,0,.14),0 6px 16px -6px rgba(255,255,255,.25)}
.tab[aria-current="page"] svg{transform:translateY(-1px) scale(1.06)}
[dir="rtl"] .tab{font-size:.68rem}
@media (max-width:340px){.tab span{font-size:.58rem}}

footer{padding-block:32px 8px;font-size:.78rem;color:var(--muted);text-align:center;display:flex;flex-direction:column;gap:6px;align-items:center}
footer .note{font-family:var(--mono);font-size:.68rem;letter-spacing:.1em}

/* ===== Home path (4 stages) ===== */
.path{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:10px}
.path a{display:flex;align-items:center;gap:14px;padding:16px 16px 16px 14px;border-radius:var(--r-lg);color:var(--ink);text-decoration:none;min-height:84px}
[dir="rtl"] .path a{padding:16px 14px 16px 16px}
.path .n{width:44px;height:44px;flex:none;border-radius:14px;display:grid;place-items:center;background:var(--field);border:1px solid var(--line);font:500 .9rem var(--mono);color:var(--muted)}
.path .tx{flex:1;min-width:0}
.path .tx::before{content:attr(data-stage);text-transform:uppercase;display:block;font:500 .62rem var(--mono);letter-spacing:.12em;color:var(--muted);margin-bottom:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
[dir="rtl"] .path .tx::before{letter-spacing:0;font:600 .7rem var(--body)}
.path b{display:block;font:600 1.08rem var(--display);letter-spacing:-.025em;line-height:1.25}
.path span.s{display:block;font-size:.84rem;color:var(--muted);margin-top:2px}
.path .go{flex:none;opacity:.5;transition:transform var(--t-base) var(--ease),opacity var(--t-base)}
.path a:hover .go{opacity:1;transform:translateX(3px)}
[dir="rtl"] .path a:hover .go{transform:scaleX(-1) translateX(3px)}
.path li.now a{background:var(--obsidian);color:#fff;border-color:rgba(255,255,255,.12);box-shadow:inset 0 1px 0 rgba(255,255,255,.16),var(--sh-2)}
.path li.now a::before{background:radial-gradient(420px circle at var(--mx,90%) var(--my,0%),rgba(255,255,255,.14),transparent 45%)}
.path li.now .tx::before{color:#A9AEB6}
.path li.now .n{background:var(--chrome);color:#0A0B0D;border-color:#fff;box-shadow:inset 0 1px 0 #fff,inset 0 -2px 4px rgba(0,0,0,.15),0 0 18px rgba(220,224,230,.3);font-weight:600}
.path li.now span.s{color:#A9AEB6}
.path li.now .go{opacity:1;width:34px;height:34px;padding:8px;border-radius:50%;background:var(--chrome);color:#0A0B0D;box-shadow:inset 0 1px 0 #fff}
.path li.ok .n{background:var(--obsidian);color:#fff;border-color:rgba(255,255,255,.12);box-shadow:inset 0 1px 0 rgba(255,255,255,.2)}
:root[data-theme="dark"] .path li.ok .n{background:#F4F5F7;color:#0A0B0D}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .path li.ok .n{background:#F4F5F7;color:#0A0B0D}}
/* connector line between stages */
.path li{position:relative}
.path li:not(:last-child)::after{content:"";position:absolute;inset-inline-start:36px;bottom:-11px;width:1px;height:12px;background:linear-gradient(var(--line),transparent)}

/* ===== Brand kit ===== */
.bk-name{display:flex;gap:8px}.bk-name input{flex:1;min-width:0}
.sugg{display:flex;flex-wrap:wrap;gap:8px}
.swatches{display:flex;gap:12px;flex-wrap:wrap}
.swatches label{position:relative;cursor:pointer}
.swatches input{position:absolute;opacity:0;width:1px;height:1px}
.swatches span{display:block;width:42px;height:42px;border-radius:50%;border:3px solid var(--glass-2);box-shadow:0 0 0 1px var(--line),inset 0 2px 4px rgba(255,255,255,.35),inset 0 -3px 6px rgba(0,0,0,.2);transition:transform var(--t-base) var(--spring),box-shadow var(--t-base)}
.swatches label:hover span{transform:scale(1.08)}
.swatches input:checked+span{box-shadow:0 0 0 2px var(--ink),inset 0 2px 4px rgba(255,255,255,.35),inset 0 -3px 6px rgba(0,0,0,.2);transform:scale(1.1)}
.swatches input:focus-visible+span{outline:2px solid var(--ink);outline-offset:3px}
.mock{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.mock figure{margin:0;border-radius:var(--r-lg);padding:14px;display:flex;flex-direction:column;gap:8px;align-items:center;transition:transform var(--t-base) var(--ease)}
.mock figure:hover{transform:translateY(-2px)}
.mock figure.wide{grid-column:1/-1}
.mock svg{width:100%;height:auto;display:block;filter:drop-shadow(0 10px 18px rgba(0,0,0,.14))}
.mock figcaption{font:500 .68rem var(--mono);letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
[dir="rtl"] .mock figcaption{letter-spacing:0;font:500 .78rem var(--body)}
/* ===== Season & profit ===== */
.season{display:flex;gap:10px;align-items:flex-start;padding:13px 15px;border-radius:var(--r-md);font-size:.88rem}
.season.ok{background:var(--ok-soft);color:var(--ok);border-color:transparent}
.season.late{border-inline-start:3px solid var(--ink);color:var(--ink)}
.season b{display:block}
.profit{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.profit div{background:var(--obsidian);color:#fff;border:1px solid rgba(255,255,255,.1);border-radius:var(--r-md);padding:15px;min-width:0;box-shadow:inset 0 1px 0 rgba(255,255,255,.14),var(--sh-1)}
.profit span{display:block;font-size:.72rem;color:var(--inv-muted)}
.profit b{font:600 1.15rem var(--display);letter-spacing:-.03em;color:#fff}
/* ===== About ===== */
.about-hero{background:var(--obsidian);color:#fff;border:1px solid rgba(255,255,255,.1);border-radius:var(--r-xl);padding:28px 22px;display:flex;flex-direction:column;gap:12px;box-shadow:inset 0 1px 0 rgba(255,255,255,.16),var(--sh-2);position:relative;overflow:hidden;isolation:isolate}
.about-hero::before{content:"";position:absolute;width:320px;height:320px;inset-inline-end:-120px;top:-140px;border-radius:50%;background:var(--chrome);opacity:.16;filter:blur(30px);z-index:-1}
.about-hero h2{color:#fff}
.about-hero p{color:var(--inv-muted)}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:8px}
.stats div{background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.07);border-radius:var(--r-md);padding:13px 11px;min-width:0}
.stats b{display:block;font:600 1.25rem var(--display);letter-spacing:-.03em;background:linear-gradient(100deg,#fff,#A9AEB6 60%,#fff);-webkit-background-clip:text;background-clip:text;color:transparent}
.stats span{font-size:.7rem;color:var(--inv-muted);line-height:1.3;display:block}
.contact-btns{display:flex;flex-direction:column;gap:10px}
.btn.wa{background:linear-gradient(180deg,#3BE07E,#1FB859);color:#05210F;border-color:rgba(255,255,255,.4);box-shadow:inset 0 1px 0 rgba(255,255,255,.5),0 12px 26px -12px rgba(31,184,89,.6)}
.who{display:flex;align-items:center;gap:14px;padding:16px;border-radius:var(--r-lg);text-decoration:none;color:var(--ink)}
.who .ic{width:46px;height:46px;border-radius:14px;background:var(--obsidian);color:#fff;display:grid;place-items:center;flex:none;font:600 1rem var(--display);box-shadow:inset 0 1px 0 rgba(255,255,255,.2)}
.who .tx{flex:1;min-width:0}.who b{display:block;font:600 1rem var(--display);letter-spacing:-.02em}.who span{font-size:.84rem;color:var(--muted)}
.wa-fab{position:fixed;z-index:24;inset-inline-end:max(16px,env(safe-area-inset-right,0px));bottom:calc(var(--tab-h) + 26px + env(safe-area-inset-bottom,0px));width:54px;height:54px;border-radius:50%;
  background:linear-gradient(180deg,#3BE07E,#1FB859);color:#05210F;display:grid;place-items:center;border:1px solid rgba(255,255,255,.45);box-shadow:inset 0 1px 0 rgba(255,255,255,.55),0 14px 30px -10px rgba(31,184,89,.6);text-decoration:none;transition:transform var(--t-base) var(--spring)}
.wa-fab:hover{transform:scale(1.07)}
.wa-fab svg{width:26px;height:26px}
body.no-tabs .wa-fab{display:none}

/* ===== Ready meter ===== */
.ready{display:flex;align-items:center;gap:14px}
.ready .bar{flex:1;height:8px;border-radius:4px;background:var(--field);border:1px solid var(--line);overflow:hidden}
.ready .bar i{display:block;height:100%;background:linear-gradient(90deg,#0A0B0D,#5C616A 70%,#A9AEB6);border-radius:4px;transition:width 1s var(--ease);position:relative;overflow:hidden}
.ready .bar i::after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,transparent,rgba(255,255,255,.6),transparent);animation:load 2.6s var(--ease) infinite}
:root[data-theme="dark"] .ready .bar i{background:var(--chrome)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .ready .bar i{background:var(--chrome)}}
.ready b{font:500 .9rem var(--mono);white-space:nowrap}
.ready-l{font-size:.86rem;color:var(--muted);margin-top:-12px}
/* ===== Project wizard ===== */
.qz{display:flex;flex-direction:column;gap:20px}
.qz-dots{display:flex;gap:6px}.qz-dots i{flex:1;height:4px;border-radius:2px;background:var(--line);transition:background var(--t-base)}.qz-dots i.on{background:var(--ink)}
.qz h2{font-size:clamp(1.6rem,6vw,2rem)}
.chips{display:flex;flex-wrap:wrap;gap:10px}
.chips .fchip{min-height:50px;padding:0 20px;font-size:.95rem}
.qz-sub{font:500 .7rem var(--mono);color:var(--muted);text-transform:uppercase;letter-spacing:.12em}
[dir="rtl"] .qz-sub{letter-spacing:0;font:600 .8rem var(--body)}
.qz>*{animation:rise var(--t-base) var(--ease) both}
.canvas{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.canvas div{border-radius:var(--r-md);padding:13px;min-width:0}
.canvas span{display:block;font:500 .64rem var(--mono);letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin-bottom:3px}
[dir="rtl"] .canvas span{letter-spacing:0;font:500 .74rem var(--body)}
.canvas b{font:600 .95rem var(--display);line-height:1.3;letter-spacing:-.015em}
/* ===== Study page ===== */
.incl{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
.incl li{display:flex;gap:12px;align-items:center;padding:11px 0;border-bottom:1px solid var(--line)}
.incl li:last-child{border-bottom:0}
.incl .ic{width:34px;height:34px;border-radius:10px;color:var(--muted)}
.incl .ic svg{width:16px;height:16px}
.incl li.have .ic{background:var(--obsidian);color:#fff;border-color:rgba(255,255,255,.12)}
.incl b{font:600 .95rem var(--display);letter-spacing:-.015em;display:block}
.incl small{color:var(--muted);font-size:.8rem}
.vs{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.vs div{border-radius:var(--r-md);padding:15px;font-size:.84rem;display:flex;flex-direction:column;gap:6px}
.vs .a{color:var(--muted)}
.vs .b{background:var(--obsidian);color:#fff;border:1px solid rgba(255,255,255,.1);box-shadow:inset 0 1px 0 rgba(255,255,255,.14),var(--sh-1)}
.vs h4{margin:0;font:600 .9rem var(--display);letter-spacing:-.015em}
.vs .b h4{background:linear-gradient(100deg,#fff,#A9AEB6 60%,#fff);-webkit-background-clip:text;background-clip:text;color:transparent}
.vs .b p{color:#C9CDD3}
.vs p{margin:0}

/* ===== Tablet / desktop ===== */
@media (min-width:760px){
  .split{display:grid;grid-template-columns:1fr 1fr;gap:18px;align-items:start}
  .split>div:last-child{position:sticky;top:84px}
  .plans{display:grid;grid-template-columns:repeat(3,1fr);align-items:stretch}
  .plans .inv.plan{transform:translateY(-8px) scale(1.02)}
  .plan .btn{margin-top:auto}
  .home-grid{display:grid;grid-template-columns:1.1fr .9fr;gap:20px;align-items:start}
  .quick{grid-template-columns:1fr 1fr}
  .wrap{max-width:980px}
  .path{display:grid;grid-template-columns:1fr 1fr;gap:12px}
  .path li::after{display:none}
  .sheet{bottom:auto;top:50%;transform:translateY(-50%);border-radius:var(--r-xl);border-bottom:1px solid var(--edge);animation:zoom var(--t-base) var(--spring)}
  .ambient::before{background-size:56px 56px}
}
@media (hover:none){.btn:hover,.tap:hover,.saved li:hover,.mock figure:hover{transform:none}.btn:hover::before{transform:translateX(-120%)}}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}.tick path{stroke-dashoffset:0}}

/* =====================================================================
   LIQUID GLASS · INTENSIFIED (v3.1)
   A liquid-chrome scene lives behind the app so every glass panel
   visibly refracts, reflects and shines.
   ===================================================================== */
:root{
  --glass:rgba(255,255,255,.26); --glass-2:rgba(255,255,255,.55); --edge:rgba(255,255,255,.75);
  --blur:blur(18px) saturate(190%) brightness(1.06);
  --bevel:inset 1.5px 1.5px 0 rgba(255,255,255,.95),inset -1px -1px 0 rgba(255,255,255,.35),inset 0 0 22px rgba(255,255,255,.35),inset 0 -10px 24px -14px rgba(10,12,16,.18);
  --hi:var(--bevel);
  --sh-1:0 2px 4px rgba(10,12,16,.06),0 18px 40px -18px rgba(10,12,16,.38);
  --sh-2:0 4px 10px rgba(10,12,16,.08),0 34px 70px -24px rgba(10,12,16,.55);
  --inv:linear-gradient(160deg,rgba(40,42,47,.66) 0%,rgba(10,11,13,.72) 55%,rgba(26,27,31,.66) 100%);
  --obsidian:linear-gradient(160deg,rgba(44,46,51,.78) 0%,rgba(10,11,13,.84) 55%,rgba(28,29,33,.8) 100%);
  --scene-op:.85;
}
:root[data-theme="dark"]{
  --glass:rgba(30,31,36,.28); --glass-2:rgba(36,37,42,.62); --edge:rgba(255,255,255,.16);
  --blur:blur(18px) saturate(170%) brightness(1.12);
  --bevel:inset 1.5px 1.5px 0 rgba(255,255,255,.28),inset -1px -1px 0 rgba(255,255,255,.07),inset 0 0 26px rgba(255,255,255,.06),inset 0 -12px 26px -14px rgba(0,0,0,.5);
  --hi:var(--bevel);
  --inv:linear-gradient(160deg,rgba(50,52,58,.5) 0%,rgba(12,13,15,.6) 55%,rgba(34,35,40,.5) 100%);
  --obsidian:linear-gradient(160deg,rgba(58,60,66,.6) 0%,rgba(14,15,17,.72) 55%,rgba(36,37,42,.62) 100%);
  --scene-op:.85;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --glass:rgba(30,31,36,.28); --glass-2:rgba(36,37,42,.62); --edge:rgba(255,255,255,.16);
  --blur:blur(18px) saturate(170%) brightness(1.12);
  --bevel:inset 1.5px 1.5px 0 rgba(255,255,255,.28),inset -1px -1px 0 rgba(255,255,255,.07),inset 0 0 26px rgba(255,255,255,.06),inset 0 -12px 26px -14px rgba(0,0,0,.5);
  --hi:var(--bevel);
  --inv:linear-gradient(160deg,rgba(50,52,58,.5) 0%,rgba(12,13,15,.6) 55%,rgba(34,35,40,.5) 100%);
  --obsidian:linear-gradient(160deg,rgba(58,60,66,.6) 0%,rgba(14,15,17,.72) 55%,rgba(36,37,42,.62) 100%);
  --scene-op:.85}}

/* ---------- the liquid-chrome scene behind the glass ---------- */
.ambient i{filter:blur(10px);opacity:var(--scene-op)!important;border-radius:42% 58% 63% 37% / 41% 44% 56% 59%;
  background:radial-gradient(circle at 32% 26%,#FFFFFF 0,rgba(255,255,255,.9) 9%,transparent 34%),radial-gradient(circle at 70% 78%,rgba(20,21,25,.75),transparent 46%),conic-gradient(from 210deg,#FFFFFF,#C4C8CF 14%,#45484F 28%,#F4F5F7 42%,#8A8F98 56%,#2A2C31 66%,#E6E8EB 78%,#A7ACB4 90%,#FFFFFF);
  box-shadow:inset 0 0 60px rgba(255,255,255,.6),inset -20px -30px 60px rgba(0,0,0,.35);
  animation:morph 22s ease-in-out infinite alternate}
.ambient i:nth-child(1){width:min(78vw,620px);height:min(78vw,620px);top:-12vh;inset-inline-end:-22vw;inset-inline-start:auto;bottom:auto}
.ambient i:nth-child(2){width:min(64vw,520px);height:min(64vw,520px);top:42vh;inset-inline-start:-26vw;inset-inline-end:auto;bottom:auto;animation-duration:27s;animation-direction:alternate-reverse}
.ambient i:nth-child(3){width:min(44vw,360px);height:min(44vw,360px);top:78vh;inset-inline-end:-8vw;animation-duration:19s}
.ambient i:nth-child(4){width:min(26vw,200px);height:min(26vw,200px);top:52vh;inset-inline-start:74vw;animation-duration:16s;filter:blur(3px)}
.ambient i:nth-child(5){width:150vw;height:6px;border-radius:6px;top:34vh;left:-25vw;background:linear-gradient(90deg,transparent,#fff 40%,#fff 60%,transparent);filter:blur(4px);box-shadow:0 0 30px #fff;transform:rotate(-14deg);animation:streak 9s ease-in-out infinite;opacity:.9!important}
@keyframes morph{
  0%{transform:translate3d(0,0,0) rotate(0deg);border-radius:42% 58% 63% 37% / 41% 44% 56% 59%}
  50%{border-radius:61% 39% 41% 59% / 58% 36% 64% 42%}
  100%{transform:translate3d(-4vw,5vh,0) rotate(160deg);border-radius:37% 63% 52% 48% / 62% 57% 43% 38%}}
@keyframes streak{0%,100%{transform:translateY(-6vh) rotate(-14deg);opacity:0}45%,55%{opacity:.85}50%{transform:translateY(8vh) rotate(-14deg)}}
:root[data-theme="dark"] .ambient i:nth-child(5){box-shadow:0 0 40px rgba(255,255,255,.7)}

/* ---------- glass panels: thick bevel, gloss cap, rim light, moving shine ---------- */
.card,.inv,.path a,.qa,.who{overflow:hidden}
.card::before,.inv::before,.path a::before,.qa::before,.who::before,
:root[data-theme="dark"] :is(.card,.path a,.qa,.who)::before{
  opacity:1;
  background:
    linear-gradient(115deg,transparent 42%,rgba(255,255,255,.55) 50%,transparent 58%) 160% 0/260% 100% no-repeat,
    radial-gradient(260px circle at var(--mx,-999px) var(--my,-999px),rgba(255,255,255,.45),transparent 60%),
    radial-gradient(120% 70% at 25% -18%,rgba(255,255,255,.8),rgba(255,255,255,.18) 42%,transparent 62%);
  animation:sweep 7s var(--ease) infinite}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) :is(.card,.path a,.qa,.who)::before{opacity:1;
  background:linear-gradient(115deg,transparent 42%,rgba(255,255,255,.22) 50%,transparent 58%) 160% 0/260% 100% no-repeat,radial-gradient(260px circle at var(--mx,-999px) var(--my,-999px),rgba(255,255,255,.14),transparent 60%),radial-gradient(120% 70% at 25% -18%,rgba(255,255,255,.22),rgba(255,255,255,.04) 42%,transparent 62%);animation:sweep 7s var(--ease) infinite}}
:root[data-theme="dark"] :is(.card,.path a,.qa,.who)::before{background:linear-gradient(115deg,transparent 42%,rgba(255,255,255,.22) 50%,transparent 58%) 160% 0/260% 100% no-repeat,radial-gradient(260px circle at var(--mx,-999px) var(--my,-999px),rgba(255,255,255,.14),transparent 60%),radial-gradient(120% 70% at 25% -18%,rgba(255,255,255,.22),rgba(255,255,255,.04) 42%,transparent 62%)}
.inv::before,.path li.now a::before{background:
    linear-gradient(115deg,transparent 42%,rgba(255,255,255,.28) 50%,transparent 58%) 160% 0/260% 100% no-repeat,
    radial-gradient(280px circle at var(--mx,-999px) var(--my,-999px),rgba(255,255,255,.18),transparent 60%),
    radial-gradient(120% 60% at 25% -20%,rgba(255,255,255,.3),rgba(255,255,255,.05) 45%,transparent 64%)!important;animation:sweep 7s var(--ease) infinite}
.path li:nth-child(2) a::before,.quick>*:nth-child(2)::before{animation-delay:.35s}
.path li:nth-child(3) a::before{animation-delay:.7s}.path li:nth-child(4) a::before{animation-delay:1.05s}
@keyframes sweep{0%,55%{background-position:160% 0,0 0,0 0}100%{background-position:-60% 0,0 0,0 0}}

/* rim light: bright top-left edge fading to a cool bottom-right edge */
.card::after,.inv:not(.dash)::after,.path a::after,.qa::after,.who::after,.dash::after{content:"";position:absolute;inset:0;border-radius:inherit;padding:1.2px;pointer-events:none;z-index:2;
  background:linear-gradient(135deg,rgba(255,255,255,1) 0%,rgba(255,255,255,.25) 28%,rgba(255,255,255,0) 50%,rgba(255,255,255,.2) 78%,rgba(255,255,255,.75) 100%);
  -webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask:linear-gradient(#000 0 0) content-box exclude,linear-gradient(#000 0 0)}
:root[data-theme="dark"] :is(.card,.path a,.qa,.who)::after{background:linear-gradient(135deg,rgba(255,255,255,.55),rgba(255,255,255,.06) 30%,transparent 50%,rgba(255,255,255,.05) 75%,rgba(255,255,255,.3))}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) :is(.card,.path a,.qa,.who)::after{background:linear-gradient(135deg,rgba(255,255,255,.55),rgba(255,255,255,.06) 30%,transparent 50%,rgba(255,255,255,.05) 75%,rgba(255,255,255,.3))}}

/* dark glass (dashboard, results, current step) becomes truly see-through */
.inv,.path li.now a,.profit div,.vs .b,.about-hero,.peek,.toast,.qa.y{
  -webkit-backdrop-filter:blur(16px) saturate(160%) brightness(.9);backdrop-filter:blur(16px) saturate(160%) brightness(.9);
  box-shadow:inset 1.5px 1.5px 0 rgba(255,255,255,.32),inset -1px -1px 0 rgba(255,255,255,.08),inset 0 0 30px rgba(255,255,255,.06),var(--sh-2)}
.profit div,.vs .b,.about-hero{background:var(--obsidian)}

/* small glass pieces get the bevel without pseudo layers */
.kpi,.kv div,.canvas div,.saved li,.list,.ms>li,.sum,.mock figure,.season,.vs .a,.stage-rail,.phases,.empty .ic,.trust .ic,.row .ic,.incl .ic,.lang-pick button,.onb-skip,.back,.icon-btn,.stepper button,.fchip,.search input{
  box-shadow:var(--bevel),var(--sh-1)}
.ms>li.done{box-shadow:var(--bevel)}
.fchip[aria-pressed="true"]{box-shadow:inset 1.5px 1.5px 0 rgba(255,255,255,.35),inset -1px -1px 0 rgba(255,255,255,.08),0 10px 22px -10px rgba(0,0,0,.6)}

/* fields: clear glass wells */
input,select,textarea{background-color:rgba(255,255,255,.32);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);border-color:rgba(255,255,255,.7);box-shadow:inset 0 2px 6px rgba(10,12,16,.08),inset 0 -1px 0 rgba(255,255,255,.8)}
:root[data-theme="dark"] :is(input,select,textarea){background-color:rgba(255,255,255,.05);border-color:rgba(255,255,255,.1);box-shadow:inset 0 2px 6px rgba(0,0,0,.4),inset 0 -1px 0 rgba(255,255,255,.06)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) :is(input,select,textarea){background-color:rgba(255,255,255,.05);border-color:rgba(255,255,255,.1);box-shadow:inset 0 2px 6px rgba(0,0,0,.4),inset 0 -1px 0 rgba(255,255,255,.06)}}
.seg,.tg{background:rgba(255,255,255,.28);border-color:rgba(255,255,255,.7);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px)}
:root[data-theme="dark"] :is(.seg,.tg){background:rgba(255,255,255,.05);border-color:rgba(255,255,255,.1)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) :is(.seg,.tg){background:rgba(255,255,255,.05);border-color:rgba(255,255,255,.1)}}

/* chrome elements: liquid-metal reflection that keeps moving */
.btn.y,.tab[aria-current="page"],.chip,.tick,.peek i,.toast button,.install,.path li.now .n,.path li.now .go,.tag.pro{
  background:linear-gradient(115deg,transparent 40%,rgba(255,255,255,.95) 50%,transparent 60%) 180% 0/250% 100% no-repeat,var(--chrome);
  animation:chromeflow 4.5s var(--ease) infinite}
@keyframes chromeflow{0%,60%{background-position:180% 0,0 0}100%{background-position:-80% 0,0 0}}
.btn.y{box-shadow:inset 0 1.5px 0 #fff,inset 0 -3px 6px rgba(0,0,0,.18),inset 2px 0 4px rgba(255,255,255,.6),0 2px 3px rgba(0,0,0,.18),0 18px 34px -14px rgba(0,0,0,.6)}

/* tab bar: clear liquid capsule */
.tabs{background:rgba(14,15,18,.42);-webkit-backdrop-filter:blur(20px) saturate(200%) brightness(.95);backdrop-filter:blur(20px) saturate(200%) brightness(.95);border:1px solid rgba(255,255,255,.22);
  box-shadow:inset 1.5px 1.5px 0 rgba(255,255,255,.4),inset -1px -1px 0 rgba(255,255,255,.1),inset 0 0 24px rgba(255,255,255,.08),0 26px 50px -16px rgba(0,0,0,.6)}
.tabs::before{content:"";position:absolute;inset:1px;border-radius:inherit;pointer-events:none;background:linear-gradient(180deg,rgba(255,255,255,.22),transparent 48%)}
.tab{color:#C3C7CE}

/* header glass when scrolled */
.top.scrolled{background:rgba(255,255,255,.3);box-shadow:inset 0 -1px 0 rgba(255,255,255,.7),0 10px 30px -22px rgba(0,0,0,.5)}
:root[data-theme="dark"] .top.scrolled{background:rgba(10,10,12,.35);box-shadow:inset 0 -1px 0 rgba(255,255,255,.08)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .top.scrolled{background:rgba(10,10,12,.35);box-shadow:inset 0 -1px 0 rgba(255,255,255,.08)}}

/* hover / press: glass tilts toward the light */
@media (hover:hover){
  .tap,.path a,.qa,.who{transition:transform .45s var(--spring),box-shadow var(--t-base)}
  .path a:hover,.who:hover,.qa:hover{transform:translateY(-3px) scale(1.01)}
}
@media (prefers-reduced-motion:reduce){.ambient i{animation:none!important}}

/* dark mode: selected choices in brand yellow so they stand out */

@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) :is(.fchip,.lang-pick button)[aria-pressed="true"]{background:var(--chrome);color:#0A0B0D;border-color:rgba(255,255,255,.5)}}

  <div class="sbar"><button type="button" class="snd" id="snd" hidden aria-label="Sound on"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M11 5 6 9H3v6h3l5 4z"/><path d="M15.5 8.5a5 5 0 0 1 0 7M18.5 5.5a9 9 0 0 1 0 13"/></svg></button><button type="button" class="skip" id="skip"><span id="skipT">Let's start</span><svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"/></svg></button></div>
</div>
<script>
(function(){
  var s=document.getElementById("splash"),v=document.getElementById("sv"),k=document.getElementById("skip"),gone=false;
  if(document.documentElement.lang==="ar")document.getElementById("skipT").textContent="لنبدأ";
  function hide(){if(gone)return;gone=true;s.classList.add("out");try{v.pause()}catch(_){}try{sessionStorage.setItem("startup-splash","1")}catch(_){}setTimeout(function(){s.remove()},500)}
  var seen=false;try{seen=sessionStorage.getItem("startup-splash")==="1"}catch(_){}
  var rm=window.matchMedia&&matchMedia("(prefers-reduced-motion: reduce)").matches;
  if(seen||rm){s.remove();return}
  v.addEventListener("ended",hide);v.addEventListener("error",hide);
  k.addEventListener("click",function(e){e.stopPropagation();hide()});
  s.addEventListener("click",hide);
  var snd=document.getElementById("snd");
  if(document.documentElement.lang==="ar")snd.setAttribute("aria-label","تشغيل الصوت");
  snd.addEventListener("click",function(e){e.stopPropagation();v.muted=false;var q=v.play();if(q&&q.catch)q.catch(function(){});snd.hidden=true});
  function mutedStart(){v.muted=true;var q=v.play();if(q&&q.catch)q.catch(function(){setTimeout(hide,1500)});snd.hidden=false}
  // Music on: browsers only allow sound before a tap if the user has interacted before; otherwise play muted + show the sound button.
  try{v.muted=false;var p=v.play();if(p&&p.catch)p.catch(mutedStart)}catch(_){mutedStart()}
  setTimeout(hide,16000);
})();
</script>

const ISO=s=>"⁦"+s+"⁩";const plain=s=>s.replace(/[⁦⁩]/g,"");
function amt(v,c){const x=v*CUR[c][1];return (x>=1000?Math.round(x/10)*10:Math.round(x)).toLocaleString("en-US")}
function money(v,c){return ISO(amt(v,c)+" "+CUR[c][0])}
function compact(v,c){const x=v*CUR[c][1];return '<bdi dir="ltr">'+(x>=10000?(x/1000).toFixed(1).replace(/\.0$/,"")+"K":amt(v,c))+' <small>'+CUR[c][0]+"</small></bdi>"}
function rng(a,c){return ISO(amt(a[0],c)+" – "+amt(a[1],c)+" "+CUR[c][0])}

/* ===== Toast ===== */
let toastT;
function toast(msg,action){
  const h=$("toastHost");clearTimeout(toastT);h.innerHTML="";
  const d=document.createElement("div");d.className="toast";d.innerHTML='<span class="dot"></span><span>'+esc(msg)+'</span>';
  if(action){const b=document.createElement("button");b.type="button";b.textContent=action.label;b.onclick=()=>{action.fn();h.innerHTML=""};d.appendChild(b)}
  h.appendChild(d);toastT=setTimeout(()=>{h.innerHTML=""},action?5000:2400);
}

function readEst(){return{p:$("product").value,q:Math.max(1,Math.min(100000,parseInt($("qty").value,10)||1)),c:$("country").value,o:document.querySelector('input[name="origin"]:checked').value,pack:$("pack").value,b:[$("b-label").checked,$("b-tag").checked,$("b-logo").checked]}}
function compute(x){
  const qf=x.q<100?1.25:x.q<300?1:.85;
  const prod=[BASE[x.p][0]*ORIGIN[x.o][0]*qf,BASE[x.p][1]*ORIGIN[x.o][1]*qf];
  const br=[0,0];if(x.b[0]){br[0]+=1.5;br[1]+=3}if(x.b[1]){br[0]+=1;br[1]+=2}if(x.b[2]){br[0]+=4;br[1]+=10}
  const pk=PACK[x.pack];const ship=[SHIP[x.o][0]+prod[0]*.05,SHIP[x.o][1]+prod[1]*.05];
  const sample=x.o==="IT"?[2500,6000]:[1500,4000];
  const unit=[prod[0]+br[0]+pk[0]+ship[0],prod[1]+br[1]+pk[1]+ship[1]];
  const parts=[["cProd",[prod[0]*x.q,prod[1]*x.q],"var(--y)"],["cBrand",[br[0]*x.q,br[1]*x.q],"#FFFFFF"],["cPack",[pk[0]*x.q,pk[1]*x.q],"#A3A3A3"],["cShip",[ship[0]*x.q,ship[1]*x.q],"#6B6B6B"],["cSample",sample,"#3D3D3D"]];
  const tot=[0,0];parts.forEach(p=>{tot[0]+=p[1][0];tot[1]+=p[1][1]});
  return Object.assign({},x,{parts,tot,unit});
}
function calc(){
  const t=T[L];est=compute(readEst());const c=est.c;

function svgText(x,y,size,fill,txt,st,anchor){const s=BK_STYLE[st];return `<text x="${x}" y="${y}" text-anchor="${anchor||"middle"}" font-family="${s.f}" font-weight="${s.w}" font-style="${s.it?"italic":"normal"}" font-size="${size}" letter-spacing="${s.ls*size/40}" fill="${fill}">${esc(bkText(txt,st))}</text>`}
function fitSize(n,base,max,st){const k=BK_STYLE[st||bk.style];const per=(k.up?.78:.62)+k.ls/40;return Math.min(base,Math.floor(max/(Math.max(4,n.length)*per)))}
function drawMock(){
  const t=T[L],n=(bk.name||"").trim()||t.bkPh,c=bk.color,st=bk.style,light=c==="#C9A98A";
  const ink=light?"#0A0A0A":"#FFFFFF",dot='<circle cx="0" cy="0" r="0"/>';
  const logo=`<svg viewBox="0 0 320 120" role="img" aria-label="${esc(n)}"><rect width="320" height="120" rx="14" fill="#FFFFFF"/>${svgText(160,72,fitSize(n,44,290),c,n,st)}<circle cx="${160}" cy="96" r="4" fill="#B8BDC5"/></svg>`;
  const label=`<svg viewBox="0 0 160 110"><rect x="10" y="25" width="140" height="60" rx="4" fill="${c}"/><path d="M10 25h140M10 85h140" stroke="${ink}" stroke-opacity=".25" stroke-dasharray="2 3"/>${svgText(80,62,fitSize(n,20,120),ink,n,st)}</svg>`;
  const tag=`<svg viewBox="0 0 160 110"><g transform="rotate(-8 80 55)"><rect x="45" y="10" width="70" height="95" rx="6" fill="#FFFFFF" stroke="#E5E5E5"/><circle cx="80" cy="22" r="4" fill="none" stroke="#BDBDBD"/><path d="M80 18C70 0 50 0 40 6" fill="none" stroke="#BDBDBD"/>${svgText(80,58,fitSize(n,13,60),c,n,st)}<rect x="58" y="78" width="44" height="3" rx="1.5" fill="${c}" opacity=".35"/><rect x="64" y="86" width="32" height="3" rx="1.5" fill="${c}" opacity=".35"/></g></svg>`;
  const bag=`<svg viewBox="0 0 320 170"><path d="M130 50c0-24 60-24 60 0" fill="none" stroke="${light?"#8C735C":"#3A3A3A"}" stroke-width="5"/><rect x="95" y="45" width="130" height="118" rx="6" fill="${c}"/><rect x="95" y="45" width="130" height="10" fill="#000" opacity=".08"/>${svgText(160,112,fitSize(n,22,110),ink,n,st)}</svg>`;
  $("mock").innerHTML=`<figure class="wide">${logo}<figcaption>${t.mLogo}</figcaption></figure><figure>${label}<figcaption>${t.mLabel}</figcaption></figure><figure>${tag}<figcaption>${t.mTag}</figcaption></figure><figure class="wide">${bag}<figcaption>${t.mBag}</figcaption></figure>`;
}
function suggestNames(){
  const t=T[L],pool=[...BK_NAMES].sort(()=>Math.random()-.5).slice(0,6),af=BK_AFFIX[bk.style];
  $("sugg").innerHTML=pool.map((x,i)=>{const v=af[i%af.length].replace("{n}",x);return `<button type="button" class="fchip" data-v="${esc(v)}">${esc(v)}</button>`}).join("");
  $("sugg").querySelectorAll("button").forEach(b=>b.onclick=()=>{bk.name=b.dataset.v;$("bk-name").value=bk.name;$("sugg").querySelectorAll("button").forEach(x=>x.setAttribute("aria-pressed",x===b));drawMock()});
}

/* ===== Project wizard ===== */
let qi=0,pj=null;
const PRICE_X={low:2.2,mid:2.7,high:3.5,lux:4.5};
function projLine(short){
  const t=T[L],P=S.project;if(!P)return"";
  if(short)return t.products[P.p]+" · "+t.qPrice[P.pr]+" · "+t.countries[P.c];
  const lc=x=>L==="en"?x.toLowerCase():x;
  return fmt(t.pjLine,{p:lc(t.products[P.p]),w:lc(t.qWho[P.w]),a:t.qAge[P.a],c:t.countries[P.c],r:t.qPrice[P.pr],h:P.ch.map(x=>t.qChan[x]).join(L==="ar"?" و":", ")}).replace(/\{(\w+)\}/g,"");
}
function chipRow(name,obj,val,multi){return `<div class="chips" data-q="${name}">${Object.keys(obj).map(k=>`<button type="button" class="fchip" data-v="${k}" aria-pressed="${multi?val.includes(k):val===k}">${esc(obj[k])}</button>`).join("")}</div>`}
function renderProject(){
  const t=T[L],box=$("qz");
  if(!pj)pj=S.project?JSON.parse(JSON.stringify(S.project)):{p:S.profile.product,w:"women",a:"a2",pr:"mid",c:S.profile.country,ch:["ig"],s:S.season||"any"};
  if(S.project&&qi<0){ // summary
    const P=S.project;
    box.innerHTML=`<div class="head"><p class="eyebrow">${t.pjEye}</p><h2>${t.pjH}</h2><p>${esc(projLine())}</p></div>
    <div class="canvas"><div><span>${t.cvProd}</span><b>${t.products[P.p]}</b></div><div><span>${t.cvWho}</span><b>${t.qWho[P.w]} · ${t.qAge[P.a]}</b></div>
    <div><span>${t.cvPrice}</span><b>${t.qPrice[P.pr]}</b></div><div><span>${t.cvWhere}</span><b>${t.countries[P.c]}</b></div>
    <div><span>${t.cvChan}</span><b>${P.ch.map(x=>t.qChan[x]).join(", ")}</b></div><div><span>${t.cvWhen}</span><b>${t.seasons[P.s]}</b></div></div>
    <div class="btns" style="display:grid;grid-template-columns:1fr 1fr"><button type="button" class="btn g" id="pjEdit">${t.pjEdit}</button><a class="btn y" href="#budget">${t.pjNext}</a></div>`;
    $("pjEdit").onclick=()=>{qi=0;renderProject()};return;
  }
  if(qi<0)qi=0;
  const N=5,dots=Array.from({length:N},(_,i)=>`<i class="${i<=qi?"on":""}"></i>`).join("");
  let body="";
  if(qi===0)body=chipRow("p",t.products,pj.p);
  if(qi===1)body=`<p class="qz-sub">${t.qWhoL}</p>${chipRow("w",t.qWho,pj.w)}<p class="qz-sub">${t.qAgeL}</p>${chipRow("a",t.qAge,pj.a)}`;
  if(qi===2)body=chipRow("pr",t.qPrice,pj.pr);
  if(qi===3)body=`<p class="qz-sub">${t.qCountryL}</p>${chipRow("c",t.countries,pj.c)}<p class="qz-sub">${t.qChanL}</p>${chipRow("ch",t.qChan,pj.ch,true)}`;
  if(qi===4)body=chipRow("s",t.seasons,pj.s);
  box.innerHTML=`<div class="qz-dots">${dots}</div><p class="qz-sub">${fmt(t.qzOf,{a:qi+1,b:N})}</p><h2>${t.qzQ[qi]}</h2>${body}
  <div class="btns" style="display:grid;grid-template-columns:1fr 2fr;margin-top:8px"><button type="button" class="btn g" id="qzB">${t.qzBack}</button><button type="button" class="btn ${qi===N-1?"y":"k"}" id="qzN">${qi===N-1?t.qzDone:t.qzNext}</button></div>`;
  box.querySelectorAll(".chips").forEach(row=>{const q=row.dataset.q;row.querySelectorAll("button").forEach(b=>b.onclick=()=>{
    if(q==="ch"){const v=b.dataset.v;pj.ch=pj.ch.includes(v)?pj.ch.filter(x=>x!==v):[...pj.ch,v];if(!pj.ch.length)pj.ch=[v]}else pj[q]=b.dataset.v;
    haptic();renderProject()})});
  $("qzB").onclick=()=>{if(qi===0){location.hash="#home";return}qi--;renderProject()};
  $("qzN").onclick=()=>{if(qi<N-1){qi++;renderProject();window.scrollTo(0,0);return}
    S.project=JSON.parse(JSON.stringify(pj));S.season=pj.s;S.profile.product=pj.p;S.profile.country=pj.c;persist();
    $("product").value=pj.p;$("country").value=pj.c;$("season").value=pj.s;sellTouched=false;calc();renderProfile();renderPath();
    qi=-1;renderProject();window.scrollTo(0,0)};
}
function renderIncl(){
  const t=T[L],have=[!!S.project,!!S.project,false,false,false,S.saved.length>0,S.saved.length>0,!!(S.brand&&S.brand.name),false,false,false,false];
  $("incl").innerHTML=t.incl.map((x,i)=>`<li class="${have[i]?"have":""}"><span class="ic">${have[i]?CHECK:IC.lock}</span><div><b>${x[0]}</b><small>${have[i]?t.haveIt:x[1]}</small></div></li>`).join("");
}

/* ===== Contact ===== */
function waLink(msg){return CONTACT_WA?"https://wa.me/"+CONTACT_WA+(msg?"?text="+encodeURIComponent(msg):""):""}
function renderContact(){
  const t=T[L],b=[];
  if(CONTACT_WA)b.push(`<a class="btn wa block" href="${waLink(t.hi+" Startup")}" target="_blank" rel="noopener">${IC.wa}<span>${t.ctWa}</span></a>`);
  if(CONTACT_EMAIL)b.push(`<a class="btn k block" href="mailto:${CONTACT_EMAIL}">${t.ctMail}</a>`);
  if(CONTACT_IG)b.push(`<a class="btn o block" href="https://instagram.com/${CONTACT_IG}" target="_blank" rel="noopener">${t.ctIg} · @${CONTACT_IG}</a>`);
  b.push(`<a class="btn ${b.length?"g":"y"} block" href="#request">${t.ctForm}</a>`);
  $("ctBtns").innerHTML=b.join("");
  const f=$("waFab");if(CONTACT_WA){f.href=waLink(t.hi+" Startup");f.hidden=false}else f.hidden=true;

/* ===== Dashboard ===== */
function renderPath(){
  const t=T[L],hasB=S.saved.length>0,st=S.study||lastReq;
  const href=["#project","#budget","#brand","#study"],ok=[!!S.project,hasB,!!(S.brand&&S.brand.name),!!st];
  const n=ok.filter(Boolean).length,pct=Math.round((n*25+done.size/11*0)*1)||0;
  $("readyBar").style.width=pct+"%";$("readyPct").textContent=pct+"%";
  $("readyL").textContent=n===0?t.readyL0:n===4?t.readyL4:fmt(t.readyL,{p:pct});
  const now=ok.findIndex(x=>!x);
  const arrow='<svg class="i flip go" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 5l7 7-7 7"/></svg>';
  const sub=i=>i===0&&S.project?projLine(true):ok[i]?t.doneS:t.path[i][1];
  $("path").innerHTML=t.path.map((p,i)=>`<li class="${ok[i]?"ok":""}${i===now?" now":""}"><a class="tap" href="${href[i]}"><span class="n">${ok[i]?"✓":i+1}</span><span class="tx" data-stage="${t.stageL} 0${i+1} · ${t.stages[i]}"><b>${p[0]}</b><span class="s">${sub(i)}</span></span>${arrow}</a></li>`).join("");
  renderStages(href,ok);
  renderIncl();
}
function renderStages(href,ok){
  const t=T[L];
  document.querySelectorAll(".stage-rail").forEach(r=>{const k=+r.dataset.stage;r.setAttribute("aria-label",t.stagesNav);
    r.innerHTML=t.stages.map((x,i)=>`<a class="stg${ok[i]?" done":""}${i===k?" cur":""}" href="${href[i]}"${i===k?' aria-current="step"':""}><small class="num">0${i+1}</small><b>${x}</b><i></i></a>`).join("")});
}
function renderDash(){
  renderPath();
  const t=T[L],n=done.size,pct=Math.round(n/11*100);
  $("ring").setAttribute("stroke-dashoffset",(251.3*(1-n/11)).toFixed(1));$("ringTxt").textContent=pct+"%";
  $("dDone").textContent=n+"/11";$("dWeeks").textContent=MS.reduce((a,m,i)=>a+(done.has(i)?0:m.w),0);
  if(S.saved.length){const r=compute(S.saved[0]);$("dBudget").innerHTML=compact(mid(r.tot),r.c);$("dUnit").innerHTML=compact(mid(r.unit),r.c)}else{$("dBudget").textContent="–";$("dUnit").textContent="–"}
  $("bars").innerHTML=MS.map((m,i)=>`<i class="${done.has(i)?"on":""}" style="height:${30+m.w*11}%"></i>`).join("");
  const nx=MS.findIndex((m,i)=>!done.has(i));$("dNext").textContent=nx<0?t.done:t.ms[nx][0];
  $("dTag").textContent=nx<0?t.done:n===0?t.dTagNew:t.dTag;
  $("dSub").textContent=n===0?t.dSub0:fmt(t.dSubN,{d:n});
}

/* ===== Request ===== */
const validators={
  "f-name":v=>v.trim().length>=2?"":"errName",
  "f-email":v=>/^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(v.trim())?"":"errEmail",
  "f-contact":v=>{v=v.trim();if(!v)return"";return (v.replace(/\D/g,"").length>=8&&!/[a-z@]/i.test(v))?"":"errContact"},
  "f-idea":v=>v.trim().length>=4?"":"errIdea"};
function setErr(id,key){const el=$(id),er=$("e-"+id.slice(2));if(key){el.setAttribute("aria-invalid","true");er.innerHTML=IC.alert+"<span>"+T[L][key]+"</span>";er.hidden=false}else{el.removeAttribute("aria-invalid");er.hidden=true}}
Object.keys(validators).forEach(id=>{
  $(id).addEventListener("blur",()=>{if($(id).value)setErr(id,validators[id]($(id).value))});
  $(id).addEventListener("input",()=>{if($(id).getAttribute("aria-invalid")==="true"&&!validators[id]($(id).value))setErr(id,"")});
});
function renderReq(){
  document.querySelectorAll('input[name="plan"]').forEach(r=>r.checked=r.value===plan);
  if(!$("f-name").value&&S.profile.name)$("f-name").value=S.profile.name;
  if(!$("f-email").value&&S.profile.email)$("f-email").value=S.profile.email;
  if(!$("f-brand").value&&S.brand&&S.brand.name)$("f-brand").value=S.brand.name;
  $("reqSum").innerHTML=sumRows(true);
}
document.querySelectorAll('input[name="plan"]').forEach(r=>r.addEventListener("change",()=>{plan=r.value;$("reqSum").innerHTML=sumRows(true)}));
$("req").addEventListener("submit",e=>{
  e.preventDefault();const t=T[L];let first=null;
  Object.keys(validators).forEach(id=>{const k=validators[id]($(id).value);setErr(id,k);if(k&&!first)first=id});
  if(first){$(first).focus();toast(t.errForm);return}
  const b=$("reqSubmit");b.classList.add("loading");b.disabled=true;
  setTimeout(()=>{
    b.classList.remove("loading");b.disabled=false;
    const en=T.en,brand=$("f-brand").value.trim();
    S.study=true;S.profile.email=$("f-email").value.trim();persist();
    const wa=$("f-contact").value.trim();
    lastReq=`STARTUP – ${plan==="study"?"Project study (99 QAR)":"Full launch quote"}\nName: ${$("f-name").value.trim()}\nEmail: ${$("f-email").value.trim()}${wa?"\nWhatsApp: "+wa:""}${brand?"\nBrand: "+brand:""}\nIdea: ${$("f-idea").value.trim()}\n\nEstimate: ${en.products[est.p]} × ${est.q} pcs · ${est.o==="TR"?"Turkey":"Italy"} · ${en.countries[est.c]}\nBudget: ${plain(rng(est.tot,est.c))}\nPer piece: ${plain(rng(est.unit,est.c))}\nMilestones done: ${done.size}/11\nLanguage: ${L==="ar"?"Arabic":"English"}`;
    location.hash="#sent";
  },650);
});
function renderSent(){
  const t=T[L];if(!lastReq){location.replace("#request");return}
  $("f-text").textContent=lastReq;
  const wa=$("sendWa");if(CONTACT_WA){wa.href="https://wa.me/"+CONTACT_WA+"?text="+encodeURIComponent(lastReq);wa.hidden=false}else wa.hidden=true;
  $("shareReq").hidden=!navigator.share;
  $("okP").textContent=CONTACT_WA?t.okWa:t.okShare;
  $("copyReq").textContent=t.fCopy;
}
$("shareReq").onclick=()=>{navigator.share({title:"Startup",text:lastReq}).catch(()=>{})};
$("copyReq").onclick=()=>{
  const t=T[L];const sel=()=>{const r=document.createRange();r.selectNodeContents($("f-text"));const s=getSelection();s.removeAllRanges();s.addRange(r);toast(t.selected)};
  try{navigator.clipboard.writeText(lastReq).then(()=>toast(t.copied),sel)}catch(_){sel()}
};

/* ===== Router ===== */
function route(){
  $("toastHost").innerHTML="";
  let v=(location.hash||"#home").slice(1);v=ALIAS[v]||v;
  if(![...TABS,...Object.keys(SUB)].includes(v))v="home";
  if(v==="sent"&&!lastReq)v="request";
  document.querySelectorAll(".view").forEach(s=>s.hidden=s.id!=="v-"+v);
  const parent=SUB[v];const isSub=!!parent;
  document.querySelectorAll(".tab").forEach(a=>{(a.dataset.tab===v||a.dataset.tab===parent)?a.setAttribute("aria-current","page"):a.removeAttribute("aria-current")});
  $("tabs").hidden=isSub;document.body.classList.toggle("no-tabs",isSub);
  $("brand").hidden=isSub;$("backBtn").hidden=!isSub;$("backBtn").href="#"+(v==="request"?"plans":"home");
  if(v==="project"){qi=S.project?-1:0;pj=null;renderProject()}
  if(v==="study")renderIncl();
  if(v==="request")renderReq();
  if(v==="sent")renderSent();
  window.scrollTo(0,0);
  const h=$("v-"+v).querySelector("h1,h2");if(h&&document.activeElement&&document.activeElement.closest&&document.activeElement.closest(".tabs")){h.setAttribute("tabindex","-1");h.focus({preventScroll:true})}
}
addEventListener("hashchange",route);

/* ===== Peek bar ===== */
let resVisible=true;
if("IntersectionObserver" in window){new IntersectionObserver(es=>{resVisible=es[0].isIntersecting;updPeek()},{threshold:.15}).observe($("resCard"))}
function updPeek(){$("peek").hidden=$("v-budget").hidden||resVisible}
$("peek").onclick=()=>$("resCard").scrollIntoView({behavior:"smooth",block:"center"});
addEventListener("hashchange",()=>setTimeout(updPeek,50));

/* ===== Events ===== */
$("goNext").onclick=()=>{const nx=MS.findIndex((m,i)=>!done.has(i));filter={ph:-1,st:"all",q:""};$("msq").value="";if(nx>=0)open.add(nx);renderMS();location.hash="#roadmap";setTimeout(()=>{const el=$("ms-"+nx);el&&el.scrollIntoView({block:"center",behavior:"smooth"})},80)};
addEventListener("scroll",()=>{$("top").classList.toggle("scrolled",scrollY>4)},{passive:true});
$("msq").addEventListener("input",e=>{filter.q=e.target.value;renderMS()});
$("est").addEventListener("input",calc);$("est").addEventListener("change",calc);$("est").addEventListener("submit",e=>e.preventDefault());
const step=d=>{const q=$("qty");q.value=Math.max(1,(parseInt(q.value,10)||0)+d);calc();haptic()};
$("qMinus").onclick=()=>step(-50);$("qPlus").onclick=()=>step(50);
$("season").addEventListener("change",()=>{renderSeason();persist()});
$("sell").addEventListener("input",()=>{sellTouched=true;renderProfit()});
$("bk-name").addEventListener("input",e=>{bk.name=e.target.value.slice(0,18);drawMock()});
$("bkSug").onclick=suggestNames;
$("bkSave").onclick=()=>{const t=T[L];bk.name=($("bk-name").value||"").trim();if(!bk.name){suggestNames();$("bk-name").focus();return}S.brand=Object.assign({},bk);persist();haptic();renderPath();toast(t.bkSaved);if(!$("f-brand").value)$("f-brand").value=bk.name};
$("saveEst").onclick=()=>{const t=T[L];const x=readEst();if(S.saved.length&&JSON.stringify(S.saved[0])===JSON.stringify(x)){toast(t.saved);return}const first=!S.saved.length;S.saved.unshift(x);S.saved=S.saved.slice(0,10);persist();renderSaved();renderProfile();renderDash();haptic();toast(t.saved,{label:t.seeDash,fn:()=>{location.hash="#home"}});if(first)setTimeout(()=>{location.hash="#home"},900)};
document.querySelectorAll("[data-plan]").forEach(b=>b.onclick=()=>checkout(b.dataset.plan));
$("pfForm").onsubmit=e=>{e.preventDefault();S.profile.name=$("pf-name").value.trim().slice(0,30);S.profile.country=$("pf-country").value;S.profile.product=$("pf-product").value;persist();applyProfileDefaults();calc();renderProfile();toast(T[L].profileSaved)};
document.querySelectorAll('input[name="lang"]').forEach(r=>r.addEventListener("change",()=>setLang(r.value)));
document.querySelectorAll('input[name="theme"]').forEach(r=>r.addEventListener("change",()=>{S.theme=r.value;persist();applyTheme()}));
$("resetProg").onclick=()=>{const t=T[L];confirmDlg(t.resetT,t.resetB,t.resetOk,()=>{done.clear();persist();renderAll();toast(t.progressReset)})};
$("wipe").onclick=()=>{const t=T[L];confirmDlg(t.wipeT,t.wipeB,t.wipeOk,()=>{try{localStorage.removeItem(KEY);localStorage.removeItem("startup-done");localStorage.removeItem("startup-lang")}catch(_){}location.hash="";location.reload()})};
function applyTheme(){
  if(S.theme==="auto")delete document.documentElement.dataset.theme;else document.documentElement.dataset.theme=S.theme;
  const dark=S.theme==="dark"||(S.theme==="auto"&&matchMedia("(prefers-color-scheme: dark)").matches);
  $("themeColor").content=dark?"#060607":"#ECEEF1";
}
matchMedia("(prefers-color-scheme: dark)").addEventListener&&matchMedia("(prefers-color-scheme: dark)").addEventListener("change",applyTheme);
function setLang(l){L=l;persist();renderAll()}
function updateOnline(){$("offline").hidden=navigator.onLine!==false}
addEventListener("online",updateOnline);addEventListener("offline",updateOnline);

function renderAll(){renderStatic();renderProfile();renderMS();calc();renderSaved();if(!$("v-request").hidden)renderReq();if(!$("v-sent").hidden)renderSent()}

/* ===== Boot ===== */
applyTheme();updateOnline();
renderStatic();applyProfileDefaults();renderAll();route();
if(!S.onboarded){$("onb").hidden=false;document.body.classList.add("locked");renderOnb()}
</script>

<script>
/* Pointer-reactive glass sheen (visual only) */
(function(){if(!matchMedia("(hover:hover)").matches)return;let el=null,raf=0,ev=null;
addEventListener("pointermove",e=>{ev=e;if(raf)return;raf=requestAnimationFrame(()=>{raf=0;const t=ev.target.closest&&ev.target.closest(".card,.inv,.path a,.qa,.who");if(el&&el!==t){el.style.removeProperty("--mx");el.style.removeProperty("--my")}el=t;if(!t)return;const r=t.getBoundingClientRect();t.style.setProperty("--mx",(ev.clientX-r.left)+"px");t.style.setProperty("--my",(ev.clientY-r.top)+"px")})},{passive:true})})();
if("serviceWorker" in navigator){addEventListener("load",()=>navigator.serviceWorker.register("sw.js").catch(()=>{}))}
let deferred;addEventListener("beforeinstallprompt",e=>{e.preventDefault();deferred=e;document.getElementById("install").hidden=false});
document.getElementById("install").addEventListener("click",async()=>{if(!deferred)return;deferred.prompt();await deferred.userChoice;deferred=null;document.getElementById("install").hidden=true});
addEventListener("appinstalled",()=>{document.getElementById("install").hidden=true});
</script>
